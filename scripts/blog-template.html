<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · Reversedeer</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
<script>
  /* theme-init：首帧前确定主题，避免深色模式闪白 */
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0F1115');
      }
    } catch (err) {}
  })();
</script>
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/typography.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/accessibility.css" />
    <link rel="stylesheet" href="assets/css/branding.css" />
    <link rel="stylesheet" href="assets/css/controls.css" />
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/theme-switch.css" />
    <link rel="stylesheet" href="assets/css/background-effects.css" />
    <link rel="stylesheet" href="assets/css/page-transitions.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
    <link rel="stylesheet" href="assets/css/scroll-effects.css" />
    <link rel="stylesheet" href="assets/css/pointer-effects.css" />
    <link rel="stylesheet" href="assets/css/back-to-top.css" />
    <link rel="stylesheet" href="assets/css/blog-layout.css" />
    <link rel="stylesheet" href="assets/css/blog-header.css" />
    <link rel="stylesheet" href="assets/css/article.css" />

    <script>
      /* 先落 .js 再绘制，避免入场动画的元素闪一下；
       若 animations.js 三秒内没接管（脚本加载失败），撤掉 .js，内容立即可见。 */
      document.documentElement.classList.add("js");
      window.setTimeout(function () {
        if (!document.documentElement.dataset.motion) {
          document.documentElement.classList.remove("js");
        }
      }, 3000);
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主内容</a>
    <div class="nav-sentinel" id="nav-sentinel" aria-hidden="true"></div>
    <canvas class="bg-canvas" id="bg-canvas" aria-hidden="true"></canvas>
    <div class="scroll-progress" aria-hidden="true">
      <span class="scroll-progress__bar"></span>
    </div>

          <a class="nav-link" href="https://reversedeer.com/about.html">关于</a>
          <a class="nav-link" href="index.html" aria-current="page">博客</a>
          <a class="nav-link" href="https://docs.reversedeer.com/">文档</a>
          <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="深色模式" data-theme-toggle>
            <span class="theme-switch__icon theme-switch__icon--sun" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
            <span class="theme-switch__icon theme-switch__icon--moon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span>
            <span class="theme-switch__knob" aria-hidden="true"></span>
          </button>
          <a
            class="nav-link"
            href="https://github.com/Reversedeer"
            target="_blank"
            rel="noopener noreferrer"
            ><svg
              class="icon"
              viewBox="0 0 24 24"

              focusable="false"
            >

                d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
              /></svg
            ><span>GitHub</span
            ><span class="sr-only">（在新标签页打开）</span></a
          >
        </nav>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav-panel"
          aria-label="打开菜单"
        >
          <svg
            class="icon nav-toggle__open"
            viewBox="0 0 256 256"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"
            />
          </svg>
          <svg
            class="icon nav-toggle__close"
            viewBox="0 0 256 256"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <article class="post" aria-labelledby="post-title">
        <div class="container post__container">
          <div class="blog-head blog-head--post">
            <a class="link-arrow post__back" href="index.html"
              ><span
                class="link-arrow__glyph post__back-glyph"
                aria-hidden="true"
                >←</span
              >返回博客</a
            >
            <p class="post__meta blog-head__sub">
              <time class="post__date" datetime="{{date}}">{{date}}</time>
              <span class="post__sep" aria-hidden="true">·</span>
              <span>阅读 {{readingTime}} 分钟</span>
            </p>
            <h1 class="blog-head__title post__title" id="post-title">
              <span class="blog-head__line"
                ><span class="blog-head__line-in">{{title}}</span></span
              >
            </h1>
            {{noteBlock}}
          </div>

          <div class="post__body">{{body}}</div>

          {{postNav}}
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__brand">
          <a class="wordmark site-footer__logo" href="https://reversedeer.com/" aria-label="Reversedeer，回到首页">
            <img class="wordmark__logo" src="assets/favicon.ico" alt="" width="22" height="22" />
            
          </a>
          <p class="site-footer__description">Reversedeer`s Blog &amp; Docs</p>
          <ul class="site-footer__links">
            <li>
              <a
                class="footer-link footer-link--github"
                href="https://github.com/Reversedeer"
                target="_blank"
                rel="noopener noreferrer"
                ><svg class="icon footer-github__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg><span class="sr-only">GitHub（在新标签页打开）</span></a
              >
            </li>
          </ul>
        </div>
        <div class="site-footer__legal">
          <p class="site-footer__copy">
            Copyright © 2021-<span data-year>2026</span> Reversedeer. All rights reserved.
            <span class="site-footer__filing">

                class="footer-link"
                href="https://beian.miit.gov.cn/"
                target="_blank"

                >陕ICP备2021012255号</a
              >
            </span>

        </div>
      </div>
    </footer>

    <button
      class="to-top"
      type="button"
      data-to-top
      data-to-top-float
      aria-label="回到顶部"
    >

        viewBox="0 0 256 256"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M205.66,117.66l-72,72a8,8,0,0,1-11.32,0l-72-72a8,8,0,0,1,11.32-11.32L120,164.69V40a8,8,0,0,1,16,0V164.69l58.34-58.35a8,8,0,0,1,11.32,11.32Z"
        />
      </svg>
    </button>

    <script src="assets/js/local-links.js" defer></script>
    <script src="assets/js/animations.js" defer></script>
    <script src="assets/js/navigation.js" defer></script>
    <script src="assets/js/pointer-effects.js" defer></script>
    <script src="assets/js/footer.js" defer></script>
    <script src="assets/js/back-to-top.js" defer></script>
